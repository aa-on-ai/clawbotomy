name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: core tests
            command: npm run test:core
          - check: OpenClaw bridge
            command: npm run test:openclaw
          - check: lint
            command: npm run lint
          - check: production build
            command: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}

  ui-browser:
    name: UI / browser regression audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - name: Upload failure receipts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 7

  hermes-unit:
    name: Hermes / bridge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: integrations/hermes-agent/requirements-test.txt
      - run: python -m pip install -r integrations/hermes-agent/requirements-test.txt
      - run: >-
          python -m unittest
          integrations/hermes-agent/test_bridge.py
          -v

  hermes-pinned-runtime:
    name: Hermes / pinned runtime registration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the supported Hermes runtime
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 111544d544d6cf6efed9875e116f2daeb76a1211
          path: .ci/hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            integrations/hermes-agent/requirements-test.txt
            .ci/hermes-agent/pyproject.toml
      - run: python -m pip install -r integrations/hermes-agent/requirements-test.txt
      - name: Stage the supported Hermes package outside its verification tree
        run: |
          mkdir "${RUNNER_TEMP}/hermes-agent-install"
          git -C .ci/hermes-agent archive --format=tar HEAD \
            -o "${RUNNER_TEMP}/hermes-agent.tar"
          tar -xf "${RUNNER_TEMP}/hermes-agent.tar" \
            -C "${RUNNER_TEMP}/hermes-agent-install"
      - run: python -m pip install "${RUNNER_TEMP}/hermes-agent-install"
      - name: Verify pinned source, imports, and exact tool registration
        env:
          CLAWBOTOMY_HERMES_ROOT: ${{ github.workspace }}/.ci/hermes-agent
          CLAWBOTOMY_HERMES_TEST_PLACEHOLDER_AUTH: "1"
        run: >-
          python -m unittest
          integrations/hermes-agent/test_registration_smoke.py
          -v
